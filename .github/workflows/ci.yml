name: checks

# Полный прогон pytest требует выгрузки SkillCorner в data/skillcorner/data,
# её нет в репозитории — поэтому в CI проверяются импорты и компиляция,
# а тесты запускаются локально после подключения данных.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy jinja2
      - name: Compile
        run: python -m compileall -q takt tests
      - name: Import check
        run: python -c "import takt.cli, takt.report, takt.insights, takt.metrics; print('импорт ок')"
