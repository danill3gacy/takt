name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Fetch open demo data
        run: git clone --depth 1 https://github.com/SkillCorner/opendata.git data/skillcorner
      - name: Run tests
        run: pytest -q
      - name: Build a report end-to-end
        run: python -m takt.cli report --team "Auckland FC" --out out/report.html
