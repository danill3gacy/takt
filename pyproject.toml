[project]
name = "takt"
version = "0.1.0"
description = "Предматчевый отчёт по сопернику для тренерского штаба"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "jinja2>=3.1"]

[project.scripts]
takt = "takt.cli:main"

[tool.setuptools.packages.find]
include = ["takt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
