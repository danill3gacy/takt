[project]
name = "takt"
version = "0.1.0"
description = "Предматчевый отчёт по сопернику для тренерского штаба"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "jinja2>=3.1"]

[project.scripts]
takt = "takt.cli:main"

[tool.setuptools.packages.find]
include = ["takt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# Храповик: правила ниже выключены, чтобы внедрение шло без большого рефакторинга.
# Убираем по одному — каждый раз это отдельный небольшой коммит.
ignore = ["B905", "B007", "C416"]

[tool.ruff.lint.pycodestyle]
# Форматтер переносит код по 100; порог ошибки чуть выше — для строк и SQL,
# которые он разрывать не умеет и не должен.
max-line-length = 110

[tool.mypy]
python_version = "3.11"
files = ["takt"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Следующая ступень: disallow_any_generics, затем strict = true
